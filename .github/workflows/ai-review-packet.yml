name: AI Review Packet

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  review-packet:
    name: Generate compact review packet
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out default-branch workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build compact review packet
        id: packet
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python scripts/ai-workflow/generate_review_packet.py --event-path "$GITHUB_EVENT_PATH" --output-dir packet

      - name: Upload review packet
        if: steps.packet.outputs.has_packet == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: review-packet-pr-${{ steps.packet.outputs.pr_number }}
          path: packet/review_packet.md
          if-no-files-found: error

      - name: Upload full diff
        if: steps.packet.outputs.has_packet == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: review-packet-diff-pr-${{ steps.packet.outputs.pr_number }}
          path: packet/full-diff-pr-${{ steps.packet.outputs.pr_number }}.diff
          if-no-files-found: ignore
