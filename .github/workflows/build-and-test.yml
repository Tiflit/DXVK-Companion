name: Build and Test

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record build provenance
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/provenance | Out-Null
          $headSha = git rev-parse HEAD
          $provenance = @{
            head_sha = $headSha
            ref = $env:GITHUB_REF
            sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            dotnet_version = "8.0.x"
            timestamp = (Get-Date).ToUniversalTime().ToString("o")
          }
          $provenance | ConvertTo-Json | Set-Content -Path artifacts/provenance/build-provenance.json -Encoding utf8


      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore application
        run: dotnet restore src/DXVKCompanion/DXVKCompanion.csproj

      - name: Restore Phase A tests
        run: dotnet restore tests/DXVKCompanion.PhaseA.Tests/DXVKCompanion.PhaseA.Tests.csproj

      - name: Build application
        run: dotnet build src/DXVKCompanion/DXVKCompanion.csproj --configuration Release --no-restore

      - name: Build Phase A tests
        run: dotnet build tests/DXVKCompanion.PhaseA.Tests/DXVKCompanion.PhaseA.Tests.csproj --configuration Release --no-restore

      - name: Run Phase A tests
        run: dotnet test tests/DXVKCompanion.PhaseA.Tests/DXVKCompanion.PhaseA.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=detailed" --logger "trx;LogFileName=phase-a-tests.trx"

      - name: Report Test Failures
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path "**/*.trx" -Recurse | ForEach-Object {
            [xml]$xml = Get-Content $_.FullName
            if ($xml.TestRun.Results.UnitTestResult) {
              $xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object {
                Write-Host "::error title=$($_.testName)::$($_.Output.ErrorInfo.Message)"
                Write-Host "FAILED TEST: $($_.testName)"
                Write-Host "$($_.Output.ErrorInfo.Message)"
                Write-Host "$($_.Output.ErrorInfo.StackTrace)"
              }
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase-a-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      - name: Upload build provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-provenance
          path: artifacts/provenance/build-provenance.json
          if-no-files-found: ignore

      - name: Publish portable self-contained win-x64 binary
        shell: pwsh
        run: |
          dotnet publish src/DXVKCompanion/DXVKCompanion.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            --output ./artifacts/publish

      - name: Upload DXVK Companion Executable
        uses: actions/upload-artifact@v6
        with:
          name: DXVK-Companion-win-x64
          path: ./artifacts/publish/
          if-no-files-found: error
