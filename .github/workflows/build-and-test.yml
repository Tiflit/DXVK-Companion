name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore application
        run: dotnet restore src/DXVKCompanion/DXVKCompanion.csproj

      - name: Restore Phase A tests
        run: dotnet restore tests/DXVKCompanion.PhaseA.Tests/DXVKCompanion.PhaseA.Tests.csproj

      - name: Build application
        run: dotnet build src/DXVKCompanion/DXVKCompanion.csproj --configuration Release --no-restore

      - name: Build Phase A tests
        run: dotnet build tests/DXVKCompanion.PhaseA.Tests/DXVKCompanion.PhaseA.Tests.csproj --configuration Release --no-restore

      - name: Run Phase A tests
        run: dotnet test tests/DXVKCompanion.PhaseA.Tests/DXVKCompanion.PhaseA.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=phase-a-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase-a-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
