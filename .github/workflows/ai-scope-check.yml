name: AI Scope Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to evaluate'
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  scope-check:
    name: AI task scope
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}


    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compare changed files with Issue allowed paths
        run: |
          python scripts/ai-workflow/evaluate_scope.py --pr-number "$PR_NUMBER"
