name: AI Workflow Tests

on:
  push:
    branches: [ main, 'feature/**', 'workflow/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-tests:
    name: Run Python workflow tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline regression fixtures
        run: python -m unittest discover -s tests/ai-workflow -v
