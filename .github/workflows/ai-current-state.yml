name: AI Current State Dashboard

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  issues:
    types: [opened, closed, reopened, edited]
  pull_request_target:
    types: [opened, closed, reopened, synchronize]

permissions:
  contents: read

jobs:
  publish-dashboard:
    name: Publish AI Current State Dashboard
    runs-on: ubuntu-latest
    # Prevent execution on pull requests directly; ensure run on default branch
    # Prevent self-trigger loop on the dashboard issue itself
    if: >-
      github.event_name != 'issues' ||
      (
        !startsWith(github.event.issue.title, '[AI Dashboard]') &&
        github.event.sender.login != 'github-actions[bot]'
      )
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read

    steps:
      - name: Check out default-branch workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update and publish AI Dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python scripts/ai-workflow/update_dashboard.py --publish --repo "$GH_REPO" --token "$GH_TOKEN" --event-path "$GITHUB_EVENT_PATH"
